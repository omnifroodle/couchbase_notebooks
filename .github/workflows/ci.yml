name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check cbnb scripts

      # Notebooks are not executed in CI -- they need a live Capella cluster and
      # a model API key. This checks structure and that no credential made it
      # into a committed output.
      - name: Check notebooks
        run: python scripts/check_notebooks.py

      - name: Import helpers
        run: python -c "import cbnb; from cbnb import datasets, llm, couchbase_io, embeddings; print('ok')"
