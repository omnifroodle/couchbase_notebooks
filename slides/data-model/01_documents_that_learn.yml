notebook: notebooks/data-model/01_documents_that_learn.ipynb
summary_heading: In short
summary:
- Twenty real contracts arrive as walls of text and are stored exactly as they come — no schema,
  just prose.
- A model reads each one for the terms a lawyer would look for, and those terms are attached
  to the documents already stored — no migration, no second store.
- The notebook attaches the terms two ways — onto the document, and beside it as its own record
  — and says when each is right.
- 'Both become queryable with SQL++, so the contracts answer questions like: which California
  agreements were signed after 2015?'
- 'The claim throughout: a document can gain structured fields after it is stored and become
  queryable without ceasing to be prose.'
