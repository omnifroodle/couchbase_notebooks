notebook: notebooks/data-model/02_adding_retrieval.ipynb
summary_heading: In short
summary:
- This notebook makes the enriched contracts from data-model/01 searchable by meaning, which
  means splitting each one into chunks and embedding those.
- 'It starts by getting it wrong on purpose: a filter on a field the index does not carry
  returns zero hits and no error.'
- 'The two ways around it are a trade: filter afterwards and lose results, or copy three fields
  down onto the chunks.'
- With the copied fields, one request answers 'confidentiality terms, California law, signed
  since 2015'.
- 'The bill for that is named too: the terms now live in two places.'
