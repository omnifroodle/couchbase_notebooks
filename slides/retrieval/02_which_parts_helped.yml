notebook: notebooks/retrieval/02_which_parts_helped.ipynb
summary_heading: In short
summary:
- Four ways to search one catalogue — BM25, vector, hybrid, and hybrid with a department filter
  — run over the same 40 real queries and scored against human relevance judgements.
- 'Scored properly, they do not agree on a winner: BM25 trails on ordering, the hybrids lead
  recall, and some gaps are smaller than the run-to-run noise.'
- A department filter that barely moves the average changes recall for 8–10 of the 40 queries
  — an aggregate score hides more than it shows.
- 'No LLM and no cost: just measurement, scored with trec_eval, the reference implementation
  the IR literature reports against.'
