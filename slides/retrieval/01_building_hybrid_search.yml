notebook: notebooks/retrieval/01_building_hybrid_search.ipynb
summary_heading: In short
summary:
- Keyword search and vector search each fail on a product catalogue, in opposite directions
  — this notebook builds both and then combines them.
- One Couchbase Search index carries text, vectors and filterable fields, and answers all
  three in a single request.
- Four working searches run over 6,482 real Wayfair products, with no LLM calls.
- Two test queries pick opposite winners, which is why eyeballing results cannot tell you
  what to ship.
