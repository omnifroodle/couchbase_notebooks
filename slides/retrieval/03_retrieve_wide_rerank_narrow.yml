notebook: notebooks/retrieval/03_retrieve_wide_rerank_narrow.ipynb
summary_heading: In short
summary:
- 'A notebook about two-stage search: a cheap wide search pulls a shortlist of fifty products,
  then a cross-encoder re-reads that shortlist and reorders it.'
- 'The first attempt fails: reranking a three-word product name changes nothing (nDCG@10 0.774
  to 0.769).'
- The same model reaches 0.828 once it can also read the category path and spec text already
  sitting on the document.
- Throughout, recall never moves — reranking reorders what retrieval found; it cannot add
  to it.
- Everything is scored on 40 Wayfair queries with human judgements, running locally with no
  API cost.
