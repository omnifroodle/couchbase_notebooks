notebook: notebooks/experiments/02_is_this_the_same_customer.ipynb
summary_heading: In short
summary:
- When a sign-up, order or ticket arrives, is it someone we already know? This notebook tests
  a decision model as the judge of that question.
- A cheap search first finds the handful of known customers a new record could belong to;
  the model then reads the record beside each candidate and says how likely each is to be
  the same person.
- It picked the right customer first for 188 of the 196 returning records the search reached,
  against 137 by the search's own similarity score.
- On 200 held-out records it made 151 right decisions to a chat model's 152, at a twentieth
  of the cost and a twenty-fifth of the time.
- It fails where the records carry no date of birth: a son then scores like his father, and
  nothing in the records could tell them apart.
