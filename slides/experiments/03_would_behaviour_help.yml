notebook: notebooks/experiments/03_would_behaviour_help.ipynb
summary_heading: In short
summary:
- Can what someone buys help prove who someone is? This notebook tests behavioural evidence
  for telling customers apart, on real purchase histories from a UK online shop.
- 'The method: split each customer''s invoices into an earlier and a later account, and ask
  whether the later account''s behaviour finds the earlier one among 1,000 customers.'
- 'The result: products bought pick out the right account nine times in ten among five candidates;
  when they shop is close to useless, and averaging it in makes the result worse.'
- The case that matters most, telling apart people who share a home, cannot be tested on any
  public data. A flagged simulation shows why it must be tested separately: as housemates share
  more purchases, the stranger test improves while the housemate test collapses.
- 'A method, not a verdict: every number here illustrates the test rather than answering it.'
