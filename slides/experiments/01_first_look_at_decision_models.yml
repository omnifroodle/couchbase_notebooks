notebook: notebooks/experiments/01_first_look_at_decision_models.ipynb
summary_heading: In short
summary:
- A decision model answers narrow questions about text — yes or no, pick one, place on a scale
  — with calibrated probabilities instead of prose.
- 'It is fast and cheap enough to sit in the request path of a search: answers in about a
  quarter of a second, network included, and twelve questions in one call take no longer than
  one.'
- Confidence is 1.00 on clear messages and falls below 0.5 on ambiguous ones, so your code
  knows when to act and when to escalate.
- 'The notebook ends on the use that brought us here: reading the intent behind a search query.'
