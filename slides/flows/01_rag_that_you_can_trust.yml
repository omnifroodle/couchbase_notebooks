#   evidence    the cell whose output is the section's result; false for none
#
# `hash` is what the entry was planned against. Change the section in the
# notebook and the next review replans that entry and leaves the others alone.
notebook: notebooks/flows/01_rag_that_you_can_trust.ipynb
summary_heading: In short
summary:
- A working RAG demo is built over 510 real contracts, then judged against 820 questions whose
  answers were written down by lawyers.
- 62% of those questions have no answer in their contract, so the hardest behaviour to test
  is whether the system admits it.
- The same pipeline that aces the demo scores 64.4% across 160 judged questions and fabricates
  an answer for 23 of the unanswerable ones.
- Lawyer-marked text spans split the failures into retrieval misses and model ignores, two
  different bugs with different fixes.
- One paragraph added to the system prompt takes accuracy to 70.6%.
