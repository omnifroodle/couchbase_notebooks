notebook: notebooks/flows/04_which_model_should_answer.ipynb
summary_heading: In short
summary:
- A cheap model and a strong one answer the same 160 contract questions, and every answer
  is graded against a lawyer's annotation.
- Each routing strategy is then replayed exactly over those answers, so its accuracy and its
  bill are known rather than sampled.
- 'Every router is compared against two references: a coin flip at the same price, and an
  oracle that knew which questions needed the strong model.'
- 'The claim: none of the four routers built here beats the coin flip by more than about five
  points, and none recovers a third of the oracle''s gain.'
