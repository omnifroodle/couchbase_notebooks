notebook: notebooks/enrich/01_hypothetical_classification.ipynb
summary_heading: In short
summary:
- Putting a 1,623-path product taxonomy in an LLM prompt costs tens of thousands of tokens
  on every call.
- 'This notebook follows Doug Turnbull''s alternative: a small, cheap model invents a plausible
  category path, and Couchbase vector search snaps it to the nearest real one.'
- The trick is measured against a no-LLM baseline — embed the product title directly — on
  150 Wayfair products with known categories.
- The resolved category is then used as a prefilter on a real product search, which is what
  a classification is actually for.
