notebook: notebooks/enrich/03_read_the_spec_sheet.ipynb
summary_heading: In short
summary:
- This notebook files 300 products into a real retail category taxonomy, and compares ways
  of picking the right category path.
- 'It reruns an earlier comparison: embedding the product name versus asking a chat model
  to invent a path and snapping it to the nearest real category.'
- It then gives both methods the product's features, and replaces the nearest-neighbour step
  with Jev, a decision model that chooses among a shortlist of real categories.
- The judge lifts exact paths from 30.7% to 43.3%, and a pipeline with no chat model at all
  reaches 37.7%.
- It also counts what each method costs in tokens, time and cents.
