[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbnb"
version = "0.1.0"
description = "Shared helpers for the Couchbase demo notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "couchbase>=4.6",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
# trec_eval bindings: the reference implementation IR results are reported against.
# Pure-python wrapper over pytrec-eval-terrier, which ships binary wheels.
metrics = ["ir-measures>=0.3"]
plots = ["matplotlib>=3.7"]
dev = ["jupyter>=1.0", "nbclient>=0.10", "nbformat>=5.10", "ruff>=0.6"]
all = ["cbnb[local-embeddings,plots,metrics,dev]"]

[tool.setuptools]
packages = ["cbnb"]

[tool.setuptools.package-data]
cbnb = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
